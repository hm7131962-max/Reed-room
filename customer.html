<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RED ROOM — تطبيق العميل</title><link rel="stylesheet" href="css/styles.css"><style>.portal{max-width:760px;margin:7vh auto;padding:20px}.portal .panel{margin:14px 0}.portal input,.portal select{width:100%;margin:7px 0 12px;padding:12px;border-radius:9px;background:#11131a;color:#fff;border:1px solid #343744}.hidden{display:none!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border-radius:9px;background:#222733;margin:10px 0}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="portal"><header class="brand"><div class="brand-mark">RR</div><div><strong>RED ROOM / BANKING APP</strong><small>DEMO CUSTOMER PORTAL</small></div></header><section class="panel" id="login"><h2>دخول العميل</h2><form id="loginForm"><label>رقم الحساب<input name="accountNumber" required autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary full">تسجيل الدخول</button></form></section><section id="app" class="hidden"><section class="panel"><div class="panel-head"><div><h2 id="customerName">حساب العميل</h2><p id="customerMeta"></p></div><button class="btn" id="logout">خروج</button></div><h1 id="balance"></h1><small>الرصيد التجريبي</small></section><section class="panel"><h2>البحث عن مستفيد</h2><form id="lookupForm"><label>رقم حساب المستفيد<input name="accountNumber" required></label><button class="btn">بحث</button></form><div id="matches"></div></section><section class="panel hidden" id="transferPanel"><h2>تحويل تجريبي</h2><div id="beneficiaryInfo" class="notice"></div><form id="transferForm"><input type="hidden" name="beneficiaryId"><label>المبلغ<input name="amount" type="number" min="0.01" step="0.01" required></label><button class="btn btn-primary full">تأكيد التحويل التجريبي</button></form></section><section class="panel"><h2>آخر التحويلات</h2><div id="history"></div></section></section><p id="message" class="notice" aria-live="polite">نظام تجريبي فقط — لا ينفذ تحويلات مالية حقيقية.</p></main><script>
const API=localStorage.getItem('rr_api_url')||location.origin;let token='',selected=null;const $=s=>document.querySelector(s);const msg=t=>$('#message').textContent=t;async function call(path,opt={}){const r=await fetch(API+'/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'تعذر تنفيذ الطلب');return d;}function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2});}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));const d=await call('/auth/customer',{method:'POST',body:JSON.stringify(f)});token=d.token;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await refresh();msg('تم تسجيل الدخول.');}catch(x){msg(x.message)}};
async function refresh(){const c=await call('/customer/me');$('#customerName').textContent=c.fullName;$('#customerMeta').textContent=`${c.bankName} • ${c.branchName} • ${c.accountNumber}`;$('#balance').textContent=money(c.balance);const rows=await call('/customer/transfers');$('#history').innerHTML=rows.length?rows.map(x=>`<div class="notice">${x.beneficiary_name} — ${money(x.amount)} — ${new Date(x.created_at).toLocaleString('ar')}</div>`).join(''):'لا توجد تحويلات بعد.';}
$('#lookupForm').onsubmit=async e=>{e.preventDefault();try{const n=new FormData(e.target).get('accountNumber');const rows=await call('/customer/beneficiaries/'+encodeURIComponent(n));$('#matches').innerHTML=rows.length?rows.map(b=>`<button class="btn full" data-beneficiary="${b.id}" data-name="${b.full_name}" data-bank="${b.bank_name}" data-branch="${b.branch_name}" data-type="${b.account_type}">${b.full_name} — ${b.bank_name}</button>`).join(''):'لم يتم العثور على مستفيد بهذا الرقم.';$('#matches').querySelectorAll('[data-beneficiary]').forEach(btn=>btn.onclick=()=>{selected=btn.dataset.beneficiary;$('#transferForm [name=beneficiaryId]').value=selected;$('#beneficiaryInfo').textContent=`${btn.dataset.name} • ${btn.dataset.bank} • ${btn.dataset.branch} • ${btn.dataset.type}`;$('#transferPanel').classList.remove('hidden')});}catch(x){msg(x.message)}};
$('#transferForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));const d=await call('/customer/transfers',{method:'POST',body:JSON.stringify(f)});msg(`تم تسجيل التحويل التجريبي. المرجع: ${d.reference}`);$('#transferPanel').classList.add('hidden');e.target.reset();await refresh();}catch(x){msg(x.message)}};$('#logout').onclick=()=>{token='';selected=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');msg('تم تسجيل الخروج.');};
</script></body></html>
