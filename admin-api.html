<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RED ROOM — إدارة الحسابات</title><link rel="stylesheet" href="css/styles.css"><style>.portal{max-width:1050px;margin:4vh auto;padding:18px}.portal .panel{margin:14px 0}.portal input,.portal select{width:100%;margin:6px 0 12px;padding:11px;border-radius:8px;background:#11131a;color:#fff;border:1px solid #343744}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hidden{display:none!important}.notice{padding:12px;background:#242833;border-radius:9px;margin:10px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="portal"><header class="brand"><div class="brand-mark">RR</div><div><strong>RED ROOM / ADMIN API</strong><small>SECURE DEMO CONTROL</small></div></header><section class="panel" id="login"><h2>دخول الأدمن</h2><form id="loginForm" class="row"><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور<input name="password" type="password" required></label><button class="btn btn-primary">دخول</button></form></section><section id="dashboard" class="hidden"><div class="tabs"><button class="btn" data-tab="customers">العملاء</button><button class="btn" data-tab="beneficiaries">المستفيدون</button><button class="btn" id="logout">خروج</button></div><div id="content"></div></section><p id="message" class="notice">بيئة تجريبية فقط؛ لا تدخل بيانات مصرفية حقيقية.</p></main><script>
const API=localStorage.getItem('rr_api_url')||location.origin;let token='',banks=[],branches=[];const $=s=>document.querySelector(s);const msg=t=>$('#message').textContent=t;async function call(path,opt={}){const r=await fetch(API+'/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'فشل الطلب');return d;}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await call('/auth/admin',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');await loadCustomers();}catch(x){msg(x.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='customers'?loadCustomers():loadBeneficiaries());
async function loadCustomers(){try{[banks,branches]=await Promise.all([call('/admin/banks'),call('/admin/branches')]);const list=await call('/admin/customers');$('#content').innerHTML=`<section class="panel"><h2>إضافة حساب عميل</h2><form id="customerForm"><div class="row"><label>البنك<select name="bankId">${banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`)}</select></label><label>الفرع<select name="branchId">${branches.map(b=>`<option value="${b.id}">${esc(b.bank_name)} — ${esc(b.name)}</option>`)}</select></label><label>الاسم الكامل<input name="fullName" required></label><label>رقم الحساب<input name="accountNumber" required></label><label>نوع الحساب<select name="accountType"><option value="savings">توفير</option><option value="current">جاري</option></select></label><label>كلمة المرور<input name="password" type="password" minlength="10" required></label><label>الرصيد<input name="balance" type="number" min="0" step=".01" value="0"></label></div><button class="btn btn-primary">إنشاء الحساب</button></form></section><section class="panel"><h2>حسابات العملاء (${list.length})</h2>${list.map(c=>`<div class="notice"><b>${esc(c.fullName)}</b> — ${esc(c.accountNumber)} — ${esc(c.bankName)} — الرصيد: ${c.balance} — ${esc(c.status)}<form class="balanceForm" data-id="${c.id}"><input name="amount" type="number" step=".01" placeholder="مبلغ موجب للإضافة وسالب للخصم" required><input name="reason" placeholder="سبب التعديل"><button class="btn">تعديل الرصيد</button></form></div>`).join('')}</section>`;$('#customerForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));d.balance=Number(d.balance);await call('/admin/customers',{method:'POST',body:JSON.stringify(d)});msg('تم إنشاء حساب العميل.');loadCustomers();}catch(x){msg(x.message)}};document.querySelectorAll('.balanceForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);await call('/admin/customers/'+f.dataset.id+'/balance',{method:'POST',body:JSON.stringify(d)});msg('تم تعديل الرصيد وتسجيل الحركة.');loadCustomers();}catch(x){msg(x.message)}});}catch(x){msg(x.message)}}
async function loadBeneficiaries(){try{const list=await call('/admin/beneficiaries');$('#content').innerHTML=`<section class="panel"><h2>إضافة مستفيد مستقل</h2><form id="beneficiaryForm"><div class="row"><label>رقم الحساب<input name="accountNumber" required></label><label>اسم صاحب الحساب<input name="fullName" required></label><label>البنك<input name="bankName" required></label><label>الفرع<input name="branchName" required></label><label>نوع الحساب<input name="accountType" required placeholder="توفير / جاري"></label></div><button class="btn btn-primary">حفظ المستفيد</button></form></section><section class="panel"><h2>قاعدة المستفيدين (${list.length})</h2>${list.map(b=>`<div class="notice">${esc(b.account_number)} — ${esc(b.full_name)} — ${esc(b.bank_name)} — ${esc(b.branch_name)} — ${esc(b.account_type)} <button class="btn" data-del="${b.id}">حذف</button></div>`).join('')}</section>`;$('#beneficiaryForm').onsubmit=async e=>{e.preventDefault();try{await call('/admin/beneficiaries',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});msg('تمت إضافة المستفيد.');loadBeneficiaries();}catch(x){msg(x.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف المستفيد؟')){await call('/admin/beneficiaries/'+b.dataset.del,{method:'DELETE'});loadBeneficiaries();}});}catch(x){msg(x.message)}}
$('#logout').onclick=()=>{token='';$('#dashboard').classList.add('hidden');$('#login').classList.remove('hidden');};
</script></body></html>
